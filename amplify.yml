version: 1
applications:
  - appRoot: react-apps-example/main-app
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies for Main App..."
            - npm install
        build:
          commands:
            - echo "Building Main App..."
            - echo "Environment:"
            - echo "REACT_APP_COGNITO_AUTHORITY=$REACT_APP_COGNITO_AUTHORITY"
            - echo "REACT_APP_COGNITO_CLIENT_ID=$REACT_APP_COGNITO_CLIENT_ID"
            - echo "REACT_APP_COGNITO_DOMAIN=$REACT_APP_COGNITO_DOMAIN"
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
  - appRoot: react-apps-example/admin-portal
    frontend:
      phases:
        preBuild:
          commands:
            - echo "Installing dependencies for Admin Portal..."
            - npm install
        build:
          commands:
            - echo "Building Admin Portal..."
            - echo "Environment:"
            - echo "REACT_APP_COGNITO_AUTHORITY=$REACT_APP_COGNITO_AUTHORITY"
            - echo "REACT_APP_COGNITO_CLIENT_ID=$REACT_APP_COGNITO_CLIENT_ID"
            - echo "REACT_APP_COGNITO_DOMAIN=$REACT_APP_COGNITO_DOMAIN"
            - echo "REACT_APP_API_BASE_URL=$REACT_APP_API_BASE_URL"
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*