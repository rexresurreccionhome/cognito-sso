version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Installing dependencies for Admin Portal..."
        - npm ci
    build:
      commands:
        - echo "Building Admin Portal..."
        - echo "Environment:"
        - echo "REACT_APP_COGNITO_AUTHORITY=$REACT_APP_COGNITO_AUTHORITY"
        - echo "REACT_APP_COGNITO_CLIENT_ID=$REACT_APP_COGNITO_CLIENT_ID"
        - echo "REACT_APP_COGNITO_DOMAIN=$REACT_APP_COGNITO_DOMAIN"
        - npm run build
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*